spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.model=${GEMINI_MODEL:gemini-2.5-flash}

gemini.timeout-ms=${GEMINI_TIMEOUT_MS:20000}

jwt.secret=test-secret-key-for-ci-and-local-tests-1234567890
jwt.expiration-ms=86400000
jwt.issuer=ecommerce-market-moss
