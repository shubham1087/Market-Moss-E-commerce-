
spring.application.name=ecommerce-backend

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Gemini AI configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:20000}

# Spring AI Gemini configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.model=${GEMINI_MODEL:gemini-2.5-flash}

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=ecommerce-market-moss

# Image storage configuration
image.storage.path=uploads
image.max-size=5242880
